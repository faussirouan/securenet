<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureNet · Connexion Technicien</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0a0a0a 0%, #0d1f13 50%, #0a0a0a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
    }
    .login-box {
        background: rgba(13, 13, 13, 0.9);
        border: 1px solid rgba(46, 204, 113, 0.3);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 380px;
        color: #ffffff;
    }
    .login-box h2 { color: #2ecc71; margin-bottom: 5px; }
    .login-box p { color: #8a8a8a; font-size: 14px; margin-bottom: 25px; }
    .form-control {
        background: rgba(26, 26, 26, 0.8);
        border: 1px solid rgba(26, 71, 42, 0.6);
        color: #ffffff;
        margin-bottom: 14px;
    }
    .form-control:focus {
        background: rgba(26, 26, 26, 0.8);
        color: #ffffff;
        border-color: #2ecc71;
        box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.15);
    }
    .btn-technicien {
        background: linear-gradient(135deg, #1a472a, #2ecc71);
        border: none;
        color: #fff;
        font-weight: 600;
        width: 100%;
        padding: 10px;
    }
</style>
</head>
<body>

<div class="login-box">
    <div class="text-center mb-3">
        <i class="bi bi-tools" style="font-size: 32px; color: #2ecc71;"></i>
    </div>
    <h2 class="text-center">Espace Technicien</h2>
    <p class="text-center">Connectez-vous pour voir vos demandes</p>

    <form id="technicienLoginForm">
        <input type="email" class="form-control" id="techEmail" placeholder="Email" required>
        <input type="password" class="form-control" id="techPassword" placeholder="Mot de passe" required>
        <button type="submit" class="btn-technicien">Se connecter</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://tuxviwabtpnkgacklgeo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1eHZpd2FidHBua2dhY2tsZ2VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Njg4ODUsImV4cCI6MjEwMjM0NDg4NX0.WBZfo-LiTC_nu66BCN3E5KvkoKRz8mk5Lz3X1ibhP0w';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('technicienLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('techEmail').value.trim();
        const password = document.getElementById('techPassword').value.trim();

        const { data, error } = await supabaseClient.rpc('verifier_technicien', {
            p_email: email,
            p_mot_de_passe: password
        });

        if (error || !data || data.length === 0) {
            alert('❌ Email ou mot de passe incorrect.');
            return;
        }

        // Stocke l'identité du technicien pour cette session de navigation
        sessionStorage.setItem('technicienId', data[0].id);
        sessionStorage.setItem('technicienNom', data[0].nom);

        window.location.href = 'sidebartechnicien.html';
    });
</script>
</body>
</html>
