<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureNet · Mes demandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #0d1f13 50%, #0a0a0a 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .top-bar h2 { color: #2ecc71; margin: 0; }
        .demande-card {
            background: rgba(13, 13, 13, 0.85);
            border: 1px solid rgba(46, 204, 113, 0.2);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .demande-card .label { color: #8a8a8a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .demande-card .value { color: #fff; margin-bottom: 10px; }
        .badge-statut { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-assigne { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
        .badge-traite { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
        textarea.form-control {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(26, 71, 42, 0.6);
            color: #fff;
            margin-top: 10px;
        }
        textarea.form-control:focus {
            background: rgba(26, 26, 26, 0.9);
            border-color: #2ecc71;
            color: #fff;
            box-shadow: none;
        }
        .btn-whatsapp {
            background: #25D366;
            border: none;
            color: #fff;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-whatsapp:hover {
            background: #1da851;
            color: #fff;
            transform: scale(1.02);
        }
        .btn-deconnexion { color: #8a8a8a; text-decoration: none; font-size: 14px; transition: color 0.3s; }
        .btn-deconnexion:hover { color: #e74c3c; }
        
        @media (max-width: 576px) {
            .top-bar { flex-direction: column; align-items: flex-start; }
            .demande-card { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2><i class="bi bi-tools"></i> Mes demandes assignées</h2>
        <a href="#" id="btnDeconnexion" class="btn-deconnexion"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
    </div>

    <div id="demandesContainer">
        <p class="text-muted">Chargement...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ===== CONFIGURATION =====
    const SUPABASE_URL = 'https://tuxviwabtpnkgacklgeo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1eHZpd2FidHBua2dhY2tsZ2VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Njg4ODUsImV4cCI6MjEwMjM0NDg4NX0.WBZfo-LiTC_nu66BCN3E5KvkoKRz8mk5Lz3X1ibhP0w';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const technicienId = sessionStorage.getItem('technicienId');
    const technicienNom = sessionStorage.getItem('technicienNom') || 'Technicien';

    if (!technicienId) {
        window.location.href = 'connexiontechnicien.html';
    }

    document.getElementById('btnDeconnexion').addEventListener('click', (e) => {
        e.preventDefault();
        sessionStorage.clear();
        window.location.href = 'connexiontechnicien.html';
    });

    // ============================================================
    // ===== CACHE POUR LES DONNÉES =====
    // ============================================================
    let cacheDemandes = null;
    let cacheTimestamp = 0;
    const CACHE_DURATION = 30000; // 30 secondes

    // ============================================================
    // ===== CHARGEMENT DES DEMANDES - AVEC CACHE =====
    // ============================================================
    async function chargerDemandes(forceRefresh = false) {
        const container = document.getElementById('demandesContainer');
        
        // Vérifier le cache
        const now = Date.now();
        if (!forceRefresh && cacheDemandes && (now - cacheTimestamp) < CACHE_DURATION) {
            afficherDemandes(cacheDemandes);
            return;
        }

        try {
            container.innerHTML = `<div class="text-center py-4"><div class="spinner-border spinner-border-sm text-success" role="status"></div><span class="ms-2">Chargement...</span></div>`;

            const { data, error } = await supabaseClient
                .from('demande_audit')
                .select(`
                    id,
                    telephone,
                    entreprise,
                    type_local,
                    ville,
                    message,
                    statut,
                    date_creation,
                    client:client_id (nom)
                `)
                .eq('technicien_id', technicienId)
                .order('date_creation', { ascending: false })
                .limit(50);

            if (error) throw error;

            // Mettre en cache
            cacheDemandes = data || [];
            cacheTimestamp = now;

            afficherDemandes(cacheDemandes);

        } catch (err) {
            console.error('❌ Erreur:', err);
            container.innerHTML = `<p class="text-danger text-center py-4">❌ ${err.message}</p>`;
        }
    }

    // ============================================================
    // ===== AFFICHER LES DEMANDES =====
    // ============================================================
    function afficherDemandes(data) {
        const container = document.getElementById('demandesContainer');

        if (!data || data.length === 0) {
            container.innerHTML = `<p class="text-center text-muted py-4">📭 Aucune demande assignée</p>`;
            return;
        }

        let html = '';
        for (const d of data) {
            const badge = d.statut === 'traite'
                ? '<span class="badge-statut badge-traite">✅ Traité</span>'
                : '<span class="badge-statut badge-assigne">⏳ En attente</span>';

            const nomAffichage = d.entreprise || d.client?.nom || 'Client';
            const dateFormatee = new Date(d.date_creation).toLocaleDateString('fr-FR');

            html += `
                <div class="demande-card">
                    <div class="d-flex justify-content-between align-items-start flex-wrap">
                        <div class="value"><strong>${nomAffichage}</strong></div>
                        ${badge}
                    </div>
                    <div class="label">📞 Téléphone</div>
                    <div class="value">${d.telephone || '-'}</div>
                    <div class="label">📍 Ville / Type</div>
                    <div class="value">${d.ville || '-'} / ${d.type_local || '-'}</div>
                    <div class="label">💬 Message</div>
                    <div class="value">${d.message || '-'}</div>
                    <div class="label">📅 Date</div>
                    <div class="value">${dateFormatee}</div>

                    ${d.statut !== 'traite' ? `
                        <textarea class="form-control reponse-input mt-2" rows="2" 
                            placeholder="✏️ Réponse..." 
                            data-id="${d.id}" 
                            data-tel="${d.telephone || ''}"></textarea>
                        <button class="btn btn-whatsapp btn-envoyer mt-1" data-id="${d.id}">
                            <i class="bi bi-whatsapp"></i> Envoyer
                        </button>
                    ` : ''}
                </div>
            `;
        }

        container.innerHTML = html;

        // Événements WhatsApp (une seule fois)
        document.querySelectorAll('.btn-envoyer').forEach(btn => {
            btn.onclick = async function() {
                const id = this.dataset.id;
                const textarea = document.querySelector(`.reponse-input[data-id="${id}"]`);
                const message = textarea?.value.trim();
                const tel = textarea?.dataset.tel;

                if (!message) return alert('Écris une réponse.');

                const { error } = await supabaseClient.rpc('repondre_demande', {
                    p_demande_id: id,
                    p_technicien_id: technicienId,
                    p_message: message
                });

                if (error) return alert('❌ ' + error.message);

                if (tel) {
                    window.open(`https://wa.me/${tel.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(message)}`, '_blank');
                }

                // Recharger avec force refresh
                chargerDemandes(true);
            };
        });
    }
    
    // ===== LANCEMENT =====
    document.addEventListener('DOMContentLoaded', () => {
        chargerDemandes();
    });
</script>
 
</body>
</html>
