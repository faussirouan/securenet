<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureNet · Mes demandes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    body {
        background: linear-gradient(135deg, #0a0a0a 0%, #0d1f13 50%, #0a0a0a 100%);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        padding: 30px 20px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
    .top-bar h2 { color: #2ecc71; margin: 0; }
    .demande-card {
        background: rgba(13, 13, 13, 0.85);
        border: 1px solid rgba(46, 204, 113, 0.2);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
    }
    .demande-card .label { color: #8a8a8a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .demande-card .value { color: #fff; margin-bottom: 10px; }
    .badge-statut { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-assigne { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
    .badge-traite { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
    textarea.form-control {
        background: rgba(26, 26, 26, 0.8);
        border: 1px solid rgba(26, 71, 42, 0.6);
        color: #fff;
        margin-top: 10px;
    }
    textarea.form-control:focus {
        background: rgba(26, 26, 26, 0.9);
        border-color: #2ecc71;
        color: #fff;
        box-shadow: none;
    }
    .btn-whatsapp {
        background: #25D366;
        border: none;
        color: #fff;
        font-weight: 600;
        margin-top: 10px;
        transition: all 0.3s;
    }
    .btn-whatsapp:hover {
        background: #1da851;
        color: #fff;
        transform: scale(1.02);
    }
    .btn-pdf {
        background: #e74c3c;
        border: none;
        color: #fff;
        font-weight: 600;
        margin-top: 10px;
        transition: all 0.3s;
        padding: 8px 16px;
        border-radius: 8px;
    }
    .btn-pdf:hover {
        background: #c0392b;
        color: #fff;
        transform: scale(1.02);
    }
    .btn-deconnexion { color: #8a8a8a; text-decoration: none; font-size: 14px; transition: color 0.3s; }
    .btn-deconnexion:hover { color: #e74c3c; }
    
    @media (max-width: 576px) {
        .top-bar { flex-direction: column; align-items: flex-start; }
        .demande-card { padding: 15px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2><i class="bi bi-tools"></i> Mes demandes assignées</h2>
        <a href="#" id="btnDeconnexion" class="btn-deconnexion"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
    </div>

    <div id="demandesContainer">
        <p class="text-muted">Chargement...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    // ===== CONFIGURATION =====
    const SUPABASE_URL = 'https://tuxviwabtpnkgacklgeo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1eHZpd2FidHBua2dhY2tsZ2VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Njg4ODUsImV4cCI6MjEwMjM0NDg4NX0.WBZfo-LiTC_nu66BCN3E5KvkoKRz8mk5Lz3X1ibhP0w';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const technicienId = sessionStorage.getItem('technicienId');
    const technicienNom = sessionStorage.getItem('technicienNom') || 'Technicien';

    if (!technicienId) {
        window.location.href = 'connexiontechnicien.html';
    }

    document.getElementById('btnDeconnexion').addEventListener('click', (e) => {
        e.preventDefault();
        sessionStorage.clear();
        window.location.href = 'connexiontechnicien.html';
    });

    // ============================================================
    // ===== FONCTION GÉNÉRATION PDF - SIMPLIFIÉE ET FIABLE =====
    // ============================================================
    function genererPdfRapport(donnees) {
        try {
            // Vérifier que les données sont valides
            console.log('📄 Données reçues pour le PDF :', donnees);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            // === EN-TÊTE ===
            doc.setFillColor(13, 31, 19);
            doc.rect(0, 0, pageWidth, 45, 'F');

            doc.setFontSize(24);
            doc.setTextColor(46, 204, 113);
            doc.setFont('helvetica', 'bold');
            doc.text('SecureNet', 20, 22);

            doc.setFontSize(13);
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'normal');
            doc.text('Rapport d\'intervention technique', 20, 34);
            doc.setDrawColor(46, 204, 113);
            doc.line(20, 40, pageWidth - 20, 40);

            // === INFORMATIONS CLIENT ===
            let y = 55;
            doc.setFontSize(16);
            doc.setTextColor(46, 204, 113);
            doc.setFont('helvetica', 'bold');
            doc.text('INFORMATIONS CLIENT', 20, y);
            y += 12;

            // Affichage des données avec des VALEURS PAR DÉFAUT
            const infos = [
                { label: 'Nom / Entreprise', value: donnees.nomClient || 'Non renseigné' },
                { label: 'Téléphone', value: donnees.telephone || 'Non renseigné' },
                { label: 'Ville', value: donnees.ville || 'Non renseigné' },
                { label: 'Type de local', value: donnees.typeLocal || 'Non renseigné' },
                { label: 'Date de la demande', value: donnees.date || 'Non renseignée' }
            ];

            infos.forEach(info => {
                doc.setFontSize(11);
                doc.setTextColor(150, 150, 150);
                doc.setFont('helvetica', 'bold');
                doc.text(info.label + ' :', 25, y);
                
                doc.setTextColor(255, 255, 255);
                doc.setFont('helvetica', 'normal');
                const valueText = String(info.value || 'Non renseigné');
                const maxWidth = pageWidth - 80;
                const lines = doc.splitTextToSize(valueText, maxWidth);
                doc.text(lines, 75, y);
                y += 8;
            });

            // === SEPARATEUR ===
            y += 5;
            doc.setDrawColor(46, 204, 113);
            doc.setLineWidth(0.5);
            doc.line(20, y, pageWidth - 20, y);
            y += 10;

            // === MESSAGE DU CLIENT ===
            doc.setFontSize(16);
            doc.setTextColor(46, 204, 113);
            doc.setFont('helvetica', 'bold');
            doc.text('MESSAGE DU CLIENT', 20, y);
            y += 10;

            doc.setFontSize(11);
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'normal');
            const messageText = donnees.message || 'Aucun message';
            const messageLines = doc.splitTextToSize(messageText, pageWidth - 40);
            doc.text(messageLines, 20, y);
            y += (messageLines.length * 7) + 10;

            // === SEPARATEUR ===
            doc.setDrawColor(46, 204, 113);
            doc.setLineWidth(0.5);
            doc.line(20, y, pageWidth - 20, y);
            y += 10;

            // === RÉPONSE DU TECHNICIEN ===
            doc.setFontSize(16);
            doc.setTextColor(46, 204, 113);
            doc.setFont('helvetica', 'bold');
            doc.text('RÉPONSE DU TECHNICIEN', 20, y);
            y += 10;

            doc.setFontSize(11);
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'normal');
            const reponseText = donnees.reponse || 'Aucune réponse';
            const reponseLines = doc.splitTextToSize(reponseText, pageWidth - 40);
            doc.text(reponseLines, 20, y);
            y += (reponseLines.length * 7) + 10;

            // === PIED DE PAGE ===
            const footerY = Math.min(y + 10, pageHeight - 30);
            doc.setDrawColor(46, 204, 113);
            doc.setLineWidth(0.5);
            doc.line(20, footerY, pageWidth - 20, footerY);

            doc.setFontSize(10);
            doc.setTextColor(150, 150, 150);
            doc.setFont('helvetica', 'normal');
            doc.text('Rapport généré par SecureNet', 20, footerY + 8);
            doc.text(`Technicien : ${donnees.nomTechnicien || 'Non spécifié'}`, 20, footerY + 16);
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            doc.text(`Généré le : ${dateStr}`, pageWidth - 55, footerY + 8);

            // === SAUVEGARDE ===
            const nomClient = (donnees.nomClient || 'client').replace(/[^a-zA-Z0-9]/g, '_');
            const nomFichier = `rapport_${nomClient}_${new Date().toISOString().slice(0,10)}.pdf`;
            doc.save(nomFichier);
            console.log('✅ PDF généré avec succès !');

        } catch (error) {
            console.error('❌ Erreur PDF:', error);
            alert('❌ Erreur lors de la génération du PDF : ' + error.message);
        }
    }

    // ============================================================
    // ===== CHARGEMENT DES DEMANDES =====
    // ============================================================
    async function chargerDemandes() {
        const container = document.getElementById('demandesContainer');

        try {
            const { data, error } = await supabaseClient.rpc('get_demandes_technicien', {
                p_technicien_id: technicienId
            });

            if (error) {
                container.innerHTML = `<p class="text-danger">❌ Erreur : ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-muted">📭 Aucune demande assignée pour le moment.</p>`;
                return;
            }

            container.innerHTML = data.map((d, index) => {
                const badge = d.statut === 'traite'
                    ? '<span class="badge-statut badge-traite">✅ Traité</span>'
                    : '<span class="badge-statut badge-assigne">⏳ En attente de réponse</span>';

                const dateFormatee = new Date(d.date_creation).toLocaleDateString('fr-FR');

                // Stocker les données dans des variables
                const nomClient = d.nom_client || d.entreprise || 'Client';
                const telephone = d.telephone || '';
                const ville = d.ville || '';
                const typeLocal = d.type_local || '';
                const message = d.message || '';
                const reponse = d.reponse_texte || '';

                // Créer un ID unique pour ce bouton
                const btnId = 'pdfBtn_' + index;

                return `
                    <div class="demande-card" data-demande-id="${d.id}">
                        <div class="d-flex justify-content-between align-items-start flex-wrap">
                            <div class="value"><strong>${nomClient}</strong></div>
                            ${badge}
                        </div>
                        <div class="label">📞 Téléphone</div>
                        <div class="value" id="tel_${d.id}">${telephone || '-'}</div>
                        <div class="label">📍 Ville / Type de local</div>
                        <div class="value">${ville || '-'} / ${typeLocal || '-'}</div>
                        <div class="label">💬 Message du client</div>
                        <div class="value" id="msg_${d.id}">${message || '-'}</div>
                        <div class="label">📅 Date</div>
                        <div class="value">${dateFormatee}</div>

                        ${d.statut !== 'traite' ? `
                            <textarea class="form-control reponse-input" rows="3" 
                                placeholder="✏️ Écris ta réponse ici..." 
                                data-demande-id="${d.id}" 
                                data-telephone="${telephone}"></textarea>
                            <button class="btn btn-whatsapp btn-envoyer" data-demande-id="${d.id}">
                                <i class="bi bi-whatsapp"></i> 📲 Enregistrer et envoyer sur WhatsApp
                            </button>
                        ` : `
                            <button class="btn btn-pdf" id="${btnId}">
                                <i class="bi bi-file-earmark-pdf"></i> 📄 Télécharger le rapport PDF
                            </button>
                        `}
                    </div>
                `;
            }).join('');

            // === BOUTONS "ENVOYER" (WhatsApp) ===
            document.querySelectorAll('.btn-envoyer').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const demandeId = btn.getAttribute('data-demande-id');
                    const textarea = document.querySelector(`.reponse-input[data-demande-id="${demandeId}"]`);
                    const message = textarea.value.trim();
                    const telephone = textarea.getAttribute('data-telephone');

                    if (!message) {
                        alert('⚠️ Écris une réponse avant d\'envoyer.');
                        return;
                    }

                    const { error } = await supabaseClient.rpc('repondre_demande', {
                        p_demande_id: demandeId,
                        p_technicien_id: technicienId,
                        p_message: message
                    });

                    if (error) {
                        alert('❌ Erreur : ' + error.message);
                        return;
                    }

                    const numeroPropre = telephone.replace(/[^0-9]/g, '');
                    const lienWhatsApp = `https://wa.me/${numeroPropre}?text=${encodeURIComponent(message)}`;
                    window.open(lienWhatsApp, '_blank');

                    chargerDemandes();
                });
            });

            // === BOUTONS "TÉLÉCHARGER PDF" ===
            data.forEach((d, index) => {
                const btnId = 'pdfBtn_' + index;
                const btn = document.getElementById(btnId);
                if (btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        // Récupérer les données DIRECTEMENT depuis l'objet data
                        const donnees = {
                            nomClient: d.nom_client || d.entreprise || 'Non renseigné',
                            telephone: d.telephone || 'Non renseigné',
                            ville: d.ville || 'Non renseigné',
                            typeLocal: d.type_local || 'Non renseigné',
                            date: new Date(d.date_creation).toLocaleDateString('fr-FR'),
                            message: d.message || 'Aucun message',
                            nomTechnicien: technicienNom || 'Technicien',
                            reponse: d.reponse_texte || 'Aucune réponse'
                        };

                        console.log('📄 Données envoyées au PDF :', donnees);
                        genererPdfRapport(donnees);
                    });
                }
            });

        } catch (err) {
            container.innerHTML = `<p class="text-danger">❌ Erreur : ${err.message}</p>`;
        }
    }

    // ===== LANCEMENT =====
    chargerDemandes();
</script>

</body>
</html>
